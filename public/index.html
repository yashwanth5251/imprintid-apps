<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>imprintID Apps — Internal Tools Hub</title>
    <meta
      name="description"
      content="imprintID Apps — category-organized internal tools for shipping, sales, ordering, and operations."
    />
    <link rel="icon" type="image/png" href="./assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="/" aria-label="imprintID Apps home">
        <img
          class="brand__logo"
          src="./assets/logo.png"
          alt="imprintID"
          width="170"
          height="33"
        />
        <span class="brand__apps">Apps</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="#tools">Tools</a>
        <a href="https://www.imprintid.com/" target="_blank" rel="noopener"
          >imprintid.com</a
        >
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__media" aria-hidden="true">
          <img
            src="./assets/Headerbanner.png"
            alt=""
            class="hero__banner"
            width="1899"
            height="80"
          />
        </div>
        <div class="hero__content">
          <p class="hero__eyebrow">imprintID Apps</p>
          <h1 id="hero-title" class="hero__title">
            Your tools,<br />
            <span>category-ready.</span>
          </h1>
          <p class="hero__lede">
            One landing page for the apps that power daily work — shipping,
            sales, ordering, and ops.
          </p>
          <div class="hero__search">
            <label class="sr-only" for="tool-search">Search tools</label>
            <input
              id="tool-search"
              type="search"
              placeholder="Search tools (e.g. shipping, flyer, PO)…"
              autocomplete="off"
            />
          </div>
        </div>
      </section>

      <section id="tools" class="tools" aria-labelledby="tools-heading">
        <div class="section-head">
          <h2 id="tools-heading">Browse by category</h2>
          <p id="tools-count" class="section-head__meta"></p>
        </div>
        <div id="category-nav" class="category-nav" role="tablist"></div>
        <div id="categories" class="categories"></div>
        <p id="empty-state" class="empty-state" hidden>
          No tools match that search. Try another keyword.
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__brand">
        <img src="./assets/logo.png" alt="imprintID" width="140" height="27" />
        <span>Apps</span>
      </div>
      <p>
        © <span id="year"></span> imprintID. Internal tools hub ·
        <a href="https://www.imprintid.com/" target="_blank" rel="noopener"
          >www.imprintid.com</a
        >
      </p>
    </footer>

    <script src="./js/app.js" type="module"></script>
  </body>
</html>
